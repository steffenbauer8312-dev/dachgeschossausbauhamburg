#:schema node_modules/wrangler/config-schema.json
name = "leadgen-brevo-form-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
# workers.dev-Subdomain ist bewusst DEAKTIVIERT – der Worker wird ausschließlich
# über die Cloudflare-Zone-Routes der einzelnen Domains angesprochen.
workers_dev = false

# Beispiel-Routen. Echte Routen werden pro Domain (Zone) im Cloudflare-Dashboard
# oder via `wrangler routes put` konfiguriert. Hier nur als Referenz:
#   dachgeschossausbauhamburg.de/api/lead    → Worker
#   dachgeschossausbaumuenchen.de/api/lead   → Worker
#   … (alle 24 Domains)

[observability]
enabled = true

# Secrets werden via `wrangler secret put BREVO_API_KEY` gesetzt
# und NICHT in dieser Datei committed.
