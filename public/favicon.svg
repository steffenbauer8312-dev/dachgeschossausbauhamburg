<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Dachgeschossausbau Hamburg</title>
  <desc>Favicon - Haus mit Gaube und Wasserwelle</desc>

  <!-- House body -->
  <rect x="6" y="16" width="20" height="12" rx="1" fill="#8B3A3A"/>

  <!-- Pitched roof -->
  <polygon points="16,4 4,16 28,16" fill="#8B3A3A"/>

  <!-- Dormer/window (Gaube) -->
  <rect x="13" y="8" width="6" height="6" rx="0.5" fill="#2C5F7D"/>
  <polygon points="16,5 11,9 21,9" fill="#8B3A3A"/>
  <rect x="14" y="9" width="4" height="4" rx="0.3" fill="#2C5F7D"/>

  <!-- Water wave at bottom -->
  <path d="M0,28 Q4,25 8,28 Q12,31 16,28 Q20,25 24,28 Q28,31 32,28 L32,32 L0,32 Z" fill="#2C5F7D"/>

  <!-- Chimney -->
  <rect x="22" y="7" width="3" height="6" fill="#6B2A2A"/>
</svg>